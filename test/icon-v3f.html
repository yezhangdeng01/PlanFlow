<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #f2f4f7; margin: 0; padding: 32px; }
  h2 { margin: 0 0 6px; font-size: 18px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 24px; }
  .card { background: #fff; border-radius: 14px; padding: 28px 20px; text-align: center; box-shadow: 0 1px 5px rgba(0,0,0,.08); max-width: 420px; }
  .card .big { width: 140px; height: 140px; margin: 0 auto 16px; }
  .card .n { font-weight: 700; font-size: 14px; }
  .card .d { color: #888; font-size: 12px; margin-top: 4px; }
  .sim { margin-top: 16px; background: #eef0f3; border-radius: 8px; padding: 12px; display: flex; justify-content: center; gap: 18px; align-items: center; }
  .sim .s { display: inline-block; background: #fff; border-radius: 6px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .sim svg { display: block; }
  .sim .lbl { font-size: 11px; color: #999; }
</style>
</head>
<body>
<h2>PlanFlow 图标 · V3 第六版（8 梯形齿 · 参照标准齿轮）</h2>
<div class="sub">8 个梯形齿（顶窄 2.2 根宽 4.0，齿短 2.4，圆角 linejoin）、3 均匀环 r8.2/6.4/4.6、十字连环、红点 r0.7</div>
<div class="card">
  <div class="big">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 8 梯形齿（顶窄根宽 + 圆角，均分 45°） -->
      <g stroke="#4a6fa5" stroke-width="0.8" stroke-linejoin="round">
        <path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z"/>
        <path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(45 12 12)"/>
        <path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(90 12 12)"/>
        <path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(135 12 12)"/>
        <path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(180 12 12)"/>
        <path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(225 12 12)"/>
        <path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(270 12 12)"/>
        <path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(315 12 12)"/>
      </g>
      <!-- 均匀 3 圆环：r8.2 / r6.4 / r4.6（间距 1.8） -->
      <circle cx="12" cy="12" r="8.2" stroke="#4a6fa5" stroke-width="0.7"/>
      <circle cx="12" cy="12" r="6.4" stroke="#4a6fa5" stroke-width="0.7"/>
      <circle cx="12" cy="12" r="4.6" stroke="#4a6fa5" stroke-width="0.7"/>
      <!-- 十字：内端连 r4.6、外端连 r8.2 -->
      <g stroke="#ef8354" stroke-width="0.8" stroke-linecap="round">
        <path d="M12 3.8 V7.4"/>
        <path d="M12 16.6 V20.2"/>
        <path d="M3.8 12 H7.4"/>
        <path d="M16.6 12 H20.2"/>
      </g>
      <!-- 靶心红点 r0.7 -->
      <circle cx="12" cy="12" r="0.7" fill="#ef8354"/>
    </svg>
  </div>
  <div class="n">V3 第六版 · 8 梯形齿</div>
  <div class="d">顶窄根宽 · 齿短 2.4 · 圆角 · 环距 1.8</div>
  <div class="sim">
    <span class="s"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg"><g stroke="#4a6fa5" stroke-width="0.8" stroke-linejoin="round"><path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z"/><path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(45 12 12)"/><path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(90 12 12)"/><path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(135 12 12)"/><path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(180 12 12)"/><path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(225 12 12)"/><path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(270 12 12)"/><path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(315 12 12)"/></g><circle cx="12" cy="12" r="8.2" stroke="#4a6fa5" stroke-width="0.7"/><circle cx="12" cy="12" r="6.4" stroke="#4a6fa5" stroke-width="0.7"/><circle cx="12" cy="12" r="4.6" stroke="#4a6fa5" stroke-width="0.7"/><g stroke="#ef8354" stroke-width="0.8" stroke-linecap="round"><path d="M12 3.8 V7.4"/><path d="M12 16.6 V20.2"/><path d="M3.8 12 H7.4"/><path d="M16.6 12 H20.2"/></g><circle cx="12" cy="12" r="0.7" fill="#ef8354"/></svg></span>
    <span class="lbl">20px 侧边栏</span>
    <span class="s"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" xmlns="http://www.w3.org/2000/svg"><g stroke="#4a6fa5" stroke-width="0.8" stroke-linejoin="round"><path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z"/><path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(45 12 12)"/><path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(90 12 12)"/><path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(135 12 12)"/><path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(180 12 12)"/><path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(225 12 12)"/><path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(270 12 12)"/><path d="M10.9 0.7 L13.1 0.7 L14.0 3.1 L10.0 3.1 Z" transform="rotate(315 12 12)"/></g><circle cx="12" cy="12" r="8.2" stroke="#4a6fa5" stroke-width="0.7"/><circle cx="12" cy="12" r="6.4" stroke="#4a6fa5" stroke-width="0.7"/><circle cx="12" cy="12" r="4.6" stroke="#4a6fa5" stroke-width="0.7"/><g stroke="#ef8354" stroke-width="0.8" stroke-linecap="round"><path d="M12 3.8 V7.4"/><path d="M12 16.6 V20.2"/><path d="M3.8 12 H7.4"/><path d="M16.6 12 H20.2"/></g><circle cx="12" cy="12" r="0.7" fill="#ef8354"/></svg></span>
    <span class="lbl">36px 放大</span>
  </div>
</div>
</body>
</html>
