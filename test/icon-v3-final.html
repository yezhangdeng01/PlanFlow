<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #f2f4f7; margin: 0; padding: 32px; }
  h2 { margin: 0 0 6px; font-size: 18px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 24px; }
  .card { background: #fff; border-radius: 14px; padding: 28px 20px; text-align: center; box-shadow: 0 1px 5px rgba(0,0,0,.08); max-width: 420px; }
  .card .big { width: 140px; height: 140px; margin: 0 auto 16px; }
  .card .n { font-weight: 700; font-size: 14px; }
  .card .d { color: #888; font-size: 12px; margin-top: 4px; }
  .sim { margin-top: 16px; background: #eef0f3; border-radius: 8px; padding: 12px; display: flex; justify-content: center; gap: 18px; align-items: center; }
  .sim .s { display: inline-block; background: #fff; border-radius: 6px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .sim svg { display: block; }
  .sim .lbl { font-size: 11px; color: #999; }
</style>
</head>
<body>
<h2>PlanFlow 图标 · V3 最终版（细线 8 齿 + 十字标线）</h2>
<div class="sub">齿轮齿改细线勾勒（CAD 风），珊瑚橙十字标线穿过靶心红点——主题色深空蓝 + 珊瑚橙</div>
<div class="card">
  <div class="big">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 8 齿：细线勾勒齿形 -->
      <g stroke="#4a6fa5" stroke-width="0.9" stroke-linejoin="round">
        <path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z"/>
        <path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(45 12 12)"/>
        <path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(90 12 12)"/>
        <path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(135 12 12)"/>
        <path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(180 12 12)"/>
        <path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(225 12 12)"/>
        <path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(270 12 12)"/>
        <path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(315 12 12)"/>
      </g>
      <!-- 齿根圆 + 内圈 -->
      <circle cx="12" cy="12" r="7.9" stroke="#4a6fa5" stroke-width="1"/>
      <circle cx="12" cy="12" r="4.6" stroke="#4a6fa5" stroke-width="0.8"/>
      <!-- 十字标线（珊瑚橙，止于齿根圆内） -->
      <path d="M12 5.2 V18.8 M5.2 12 H18.8" stroke="#ef8354" stroke-width="0.9" stroke-linecap="round"/>
      <!-- 靶心红点 -->
      <circle cx="12" cy="12" r="1.4" fill="#ef8354"/>
    </svg>
  </div>
  <div class="n">V3 最终版 · 细线 8 齿 + 十字标线</div>
  <div class="d">CAD 风细线勾勒 · 珊瑚橙瞄准线 · 靶心执行点</div>
  <div class="sim">
    <span class="s"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg"><g stroke="#4a6fa5" stroke-width="0.9" stroke-linejoin="round"><path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z"/><path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(45 12 12)"/><path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(90 12 12)"/><path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(135 12 12)"/><path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(180 12 12)"/><path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(225 12 12)"/><path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(270 12 12)"/><path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(315 12 12)"/></g><circle cx="12" cy="12" r="7.9" stroke="#4a6fa5" stroke-width="1"/><circle cx="12" cy="12" r="4.6" stroke="#4a6fa5" stroke-width="0.8"/><path d="M12 5.2 V18.8 M5.2 12 H18.8" stroke="#ef8354" stroke-width="0.9" stroke-linecap="round"/><circle cx="12" cy="12" r="1.4" fill="#ef8354"/></svg></span>
    <span class="lbl">20px 侧边栏</span>
    <span class="s"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" xmlns="http://www.w3.org/2000/svg"><g stroke="#4a6fa5" stroke-width="0.9" stroke-linejoin="round"><path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z"/><path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(45 12 12)"/><path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(90 12 12)"/><path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(135 12 12)"/><path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(180 12 12)"/><path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(225 12 12)"/><path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(270 12 12)"/><path d="M10.9 1.1 L13.1 1.1 L13.5 3.9 L10.5 3.9 Z" transform="rotate(315 12 12)"/></g><circle cx="12" cy="12" r="7.9" stroke="#4a6fa5" stroke-width="1"/><circle cx="12" cy="12" r="4.6" stroke="#4a6fa5" stroke-width="0.8"/><path d="M12 5.2 V18.8 M5.2 12 H18.8" stroke="#ef8354" stroke-width="0.9" stroke-linecap="round"/><circle cx="12" cy="12" r="1.4" fill="#ef8354"/></svg></span>
    <span class="lbl">36px 放大</span>
  </div>
</div>
</body>
</html>
