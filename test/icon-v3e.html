<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #f2f4f7; margin: 0; padding: 32px; }
  h2 { margin: 0 0 6px; font-size: 18px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 24px; }
  .card { background: #fff; border-radius: 14px; padding: 28px 20px; text-align: center; box-shadow: 0 1px 5px rgba(0,0,0,.08); max-width: 420px; }
  .card .big { width: 140px; height: 140px; margin: 0 auto 16px; }
  .card .n { font-weight: 700; font-size: 14px; }
  .card .d { color: #888; font-size: 12px; margin-top: 4px; }
  .sim { margin-top: 16px; background: #eef0f3; border-radius: 8px; padding: 12px; display: flex; justify-content: center; gap: 18px; align-items: center; }
  .sim .s { display: inline-block; background: #fff; border-radius: 6px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .sim svg { display: block; }
  .sim .lbl { font-size: 11px; color: #999; }
</style>
</head>
<body>
<h2>PlanFlow 图标 · V3 第五版（12 齿密实 + 内环整体内收）</h2>
<div class="sub">12 齿均分 30°（不再稀疏）· 齿宽 2.8 · 环 r8.0/5.8/3.6 内收均匀间距 2.2 · 红点 r0.7</div>
<div class="card">
  <div class="big">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 12 齿（宽 2.8 长 2.9，均分 30°） -->
      <g stroke="#4a6fa5" stroke-width="0.8" stroke-linejoin="round">
        <path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z"/>
        <path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(30 12 12)"/>
        <path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(60 12 12)"/>
        <path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(90 12 12)"/>
        <path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(120 12 12)"/>
        <path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(150 12 12)"/>
        <path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(180 12 12)"/>
        <path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(210 12 12)"/>
        <path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(240 12 12)"/>
        <path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(270 12 12)"/>
        <path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(300 12 12)"/>
        <path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(330 12 12)"/>
      </g>
      <!-- 均匀 3 圆环：r8.0 / r5.8 / r3.6（间距 2.2） -->
      <circle cx="12" cy="12" r="8.0" stroke="#4a6fa5" stroke-width="0.7"/>
      <circle cx="12" cy="12" r="5.8" stroke="#4a6fa5" stroke-width="0.7"/>
      <circle cx="12" cy="12" r="3.6" stroke="#4a6fa5" stroke-width="0.7"/>
      <!-- 十字：内端连 r3.6、外端连 r8.0 -->
      <g stroke="#ef8354" stroke-width="0.8" stroke-linecap="round">
        <path d="M12 4.0 V8.4"/>
        <path d="M12 15.6 V20.0"/>
        <path d="M4.0 12 H8.4"/>
        <path d="M15.6 12 H20.0"/>
      </g>
      <!-- 靶心红点 r0.7 -->
      <circle cx="12" cy="12" r="0.7" fill="#ef8354"/>
    </svg>
  </div>
  <div class="n">V3 第五版 · 12 齿密实 + 内环内收</div>
  <div class="d">12 齿 · 环距 2.2 · 红点 r0.7</div>
  <div class="sim">
    <span class="s"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg"><g stroke="#4a6fa5" stroke-width="0.8" stroke-linejoin="round"><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(30 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(60 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(90 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(120 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(150 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(180 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(210 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(240 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(270 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(300 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(330 12 12)"/></g><circle cx="12" cy="12" r="8.0" stroke="#4a6fa5" stroke-width="0.7"/><circle cx="12" cy="12" r="5.8" stroke="#4a6fa5" stroke-width="0.7"/><circle cx="12" cy="12" r="3.6" stroke="#4a6fa5" stroke-width="0.7"/><g stroke="#ef8354" stroke-width="0.8" stroke-linecap="round"><path d="M12 4.0 V8.4"/><path d="M12 15.6 V20.0"/><path d="M4.0 12 H8.4"/><path d="M15.6 12 H20.0"/></g><circle cx="12" cy="12" r="0.7" fill="#ef8354"/></svg></span>
    <span class="lbl">20px 侧边栏</span>
    <span class="s"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" xmlns="http://www.w3.org/2000/svg"><g stroke="#4a6fa5" stroke-width="0.8" stroke-linejoin="round"><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(30 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(60 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(90 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(120 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(150 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(180 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(210 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(240 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(270 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(300 12 12)"/><path d="M10.6 0.8 L13.4 0.8 L13.4 3.7 L10.6 3.7 Z" transform="rotate(330 12 12)"/></g><circle cx="12" cy="12" r="8.0" stroke="#4a6fa5" stroke-width="0.7"/><circle cx="12" cy="12" r="5.8" stroke="#4a6fa5" stroke-width="0.7"/><circle cx="12" cy="12" r="3.6" stroke="#4a6fa5" stroke-width="0.7"/><g stroke="#ef8354" stroke-width="0.8" stroke-linecap="round"><path d="M12 4.0 V8.4"/><path d="M12 15.6 V20.0"/><path d="M4.0 12 H8.4"/><path d="M15.6 12 H20.0"/></g><circle cx="12" cy="12" r="0.7" fill="#ef8354"/></svg></span>
    <span class="lbl">36px 放大</span>
  </div>
</div>
</body>
