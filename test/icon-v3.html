<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #f2f4f7; margin: 0; padding: 32px; }
  h2 { margin: 0 0 6px; font-size: 18px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 640px; }
  .card { background: #fff; border-radius: 14px; padding: 24px 16px; text-align: center; box-shadow: 0 1px 5px rgba(0,0,0,.08); }
  .card .big { width: 96px; height: 96px; margin: 0 auto 14px; }
  .card .n { font-weight: 700; font-size: 14px; }
  .card .d { color: #888; font-size: 12px; margin-top: 4px; }
  .sim { margin-top: 14px; background: #eef0f3; border-radius: 8px; padding: 12px; display: flex; justify-content: center; gap: 14px; align-items: center; }
  .sim .s { display: inline-block; background: #fff; border-radius: 6px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .sim svg { display: block; }
  .sim .lbl { font-size: 11px; color: #999; }
</style>
</head>
<body>
<h2>PlanFlow 图标 · V3 改进版（8 齿齿轮 + 靶心）</h2>
<div class="sub">齿轮齿纹更明显（8 齿、细线条 1.2-1.4px），内圈 + 珊瑚橙靶心红点，20px 侧边栏仍清晰</div>
<div class="grid">
  <div class="card">
    <div class="big">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g fill="#4a6fa5">
          <rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6"/>
          <rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(45 12 12)"/>
          <rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(90 12 12)"/>
          <rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(135 12 12)"/>
          <rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(180 12 12)"/>
          <rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(225 12 12)"/>
          <rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(270 12 12)"/>
          <rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(315 12 12)"/>
        </g>
        <circle cx="12" cy="12" r="6.3" stroke="#4a6fa5" stroke-width="1.3"/>
        <circle cx="12" cy="12" r="3.1" stroke="#4a6fa5" stroke-width="1.1"/>
        <circle cx="12" cy="12" r="1.5" fill="#ef8354"/>
      </svg>
    </div>
    <div class="n">V3 最终版</div>
    <div class="d">8 齿齿轮 · 细线条 · 靶心红点</div>
    <div class="sim">
      <span class="s"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg"><g fill="#4a6fa5"><rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6"/><rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(45 12 12)"/><rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(90 12 12)"/><rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(135 12 12)"/><rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(180 12 12)"/><rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(225 12 12)"/><rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(270 12 12)"/><rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(315 12 12)"/></g><circle cx="12" cy="12" r="6.3" stroke="#4a6fa5" stroke-width="1.3"/><circle cx="12" cy="12" r="3.1" stroke="#4a6fa5" stroke-width="1.1"/><circle cx="12" cy="12" r="1.5" fill="#ef8354"/></svg></span>
      <span class="lbl">20px 侧边栏</span>
      <span class="s"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg"><g fill="#4a6fa5"><rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6"/><rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(45 12 12)"/><rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(90 12 12)"/><rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(135 12 12)"/><rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(180 12 12)"/><rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(225 12 12)"/><rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(270 12 12)"/><rect x="11.1" y="0.9" width="1.8" height="2.6" rx="0.6" transform="rotate(315 12 12)"/></g><circle cx="12" cy="12" r="6.3" stroke="#4a6fa5" stroke-width="1.3"/><circle cx="12" cy="12" r="3.1" stroke="#4a6fa5" stroke-width="1.1"/><circle cx="12" cy="12" r="1.5" fill="#ef8354"/></svg></span>
      <span class="lbl">32px 明暗对比</span>
    </div>
  </div>
</div>
</body>
</html>
