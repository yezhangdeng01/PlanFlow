name: Release

# 打任意 tag（如 1.0.4）即触发：CI 从源码构建 → 生成构建出处签名（attestation）→ 创建 Release 并上传资产。
# 解决官方审查的两条提示：
#   Warning        "Build output does not match the released main.js" —— CI 构建与审查方重建环境一致
#   Recommendation "Missing GitHub artifact attestations" —— attest-build-provenance 自动签名

on:
  push:
    tags: ["*"]

# 同一 tag 只跑一次：GitHub 偶发对一次 push 投递两个事件，双跑会在建 release 时互相撞车
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 创建 Release、上传资产
  id-token: write # Sigstore 签名（attestation 必需）
  attestations: write # 上传 attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉全量历史：release notes 需要遍历历史 tag 与上一版之间的 commit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + esbuild production)
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # 从上一版 tag 到本版的 commit 标题生成更新说明（--generate-notes 只出对比链接，不够用）
      - name: Build release notes
        run: |
          PREV_TAG=$(git tag --sort=-creatordate --merged HEAD | grep -vx "${GITHUB_REF_NAME}" | head -1 || true)
          {
            echo "## 更新内容"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --format='- %s' "${PREV_TAG}..${GITHUB_REF_NAME}"
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            else
              git log --format='- %s' "${GITHUB_REF_NAME}"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PlanFlow ${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes-file RELEASE_NOTES.md
