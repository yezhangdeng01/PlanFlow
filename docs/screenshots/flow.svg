<svg width="760" height="180" viewBox="0 0 760 180" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8ab4d8"/>
    </marker>
  </defs>
  <!-- 节点1：年度计划 -->
  <rect x="15" y="55" width="155" height="62" rx="10" fill="#4a6fa5"/>
  <text x="92" y="82" fill="#fff" text-anchor="middle" font-size="13" font-weight="600">年度计划</text>
  <text x="92" y="101" fill="#dbe7f5" text-anchor="middle" font-size="11">目标定义 · frontmatter</text>
  <!-- 箭头 -->
  <path d="M170 86 H212" stroke="#8ab4d8" stroke-width="2" marker-end="url(#arr)"/>
  <!-- 节点2：任务池 -->
  <rect x="218" y="55" width="155" height="62" rx="10" fill="#4a6fa5" opacity="0.82"/>
  <text x="295" y="82" fill="#fff" text-anchor="middle" font-size="13" font-weight="600">任务池</text>
  <text x="295" y="101" fill="#dbe7f5" text-anchor="middle" font-size="11">任务 · 计划标签归属</text>
  <!-- 箭头 -->
  <path d="M373 86 H412" stroke="#8ab4d8" stroke-width="2" marker-end="url(#arr)"/>
  <!-- 节点3：每日打卡 -->
  <rect x="418" y="30" width="155" height="62" rx="10" fill="#ef8354"/>
  <text x="495" y="57" fill="#fff" text-anchor="middle" font-size="13" font-weight="600">每日打卡</text>
  <text x="495" y="76" fill="#fdeee7" text-anchor="middle" font-size="11">勾选即写回笔记</text>
  <!-- 节点4：今日总结 -->
  <rect x="418" y="112" width="155" height="50" rx="10" fill="#ef8354" opacity="0.7"/>
  <text x="495" y="142" fill="#fff" text-anchor="middle" font-size="12" font-weight="600">今日总结 / 复盘</text>
  <!-- 打卡→总结 虚线 -->
  <path d="M495 92 V110" stroke="#f0b599" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- 箭头 -->
  <path d="M573 61 H610" stroke="#8ab4d8" stroke-width="2" marker-end="url(#arr)"/>
  <!-- 节点5：自动聚合 -->
  <rect x="616" y="30" width="130" height="132" rx="10" fill="#eef4fa" stroke="#8ab4d8" stroke-width="1.5"/>
  <text x="681" y="54" fill="#4a6fa5" text-anchor="middle" font-size="12" font-weight="600">自动聚合</text>
  <text x="681" y="74" fill="#4a6fa5" text-anchor="middle" font-size="11">本周 · 本月 · 年度</text>
  <text x="681" y="91" fill="#4a6fa5" text-anchor="middle" font-size="11">看板 · 甘特 · 统计</text>
  <text x="681" y="108" fill="#4a6fa5" text-anchor="middle" font-size="11">徽章 · 连续天数</text>
  <text x="681" y="143" fill="#8a98ab" text-anchor="middle" font-size="10">日期窗口自动归属</text>
</svg>
